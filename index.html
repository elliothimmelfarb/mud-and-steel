<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MUD &amp; STEEL — Hold the Line, 1916</title>
  <style>
    /* Boot-critical styles only; everything else lives in src/ui/*.css */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #14130f; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #14130f; color: #d8cdb4; z-index: 1000;
      font-family: 'Courier New', Courier, monospace;
      transition: opacity 0.6s ease; letter-spacing: 0.35em; text-transform: uppercase;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot h1 { font-size: 28px; font-weight: 700; margin: 0; }
    #boot p { font-size: 12px; opacity: 0.6; margin: 0; letter-spacing: 0.2em; }
    #boot .bar { width: 220px; height: 3px; background: #2b2620; }
    #boot .bar i { display: block; height: 100%; width: 0%; background: #a08a4f; transition: width 0.2s; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">
    <h1>Mud &amp; Steel</h1>
    <p>Flanders, 1916 &mdash; digging in&hellip;</p>
    <div class="bar"><i id="boot-bar"></i></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
